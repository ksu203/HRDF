<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="./irshad-logo.png">
<link rel="apple-touch-icon" href="./irshad-logo.png">
  <meta property="og:title" content="عرض المحتوى | مبادرة الإرشاد المهني الشامل">
<meta property="og:description" content="اطّلع على محتوى الإرشاد المهني الشامل">
<meta property="og:image" content="https://careerguide.works/hrdf-logo.png">
<meta property="og:url" content="https://careerguide.works">
<meta property="og:type" content="article">
<meta name="description" content="محتوى الإرشاد المهني الشامل - HRDF">
  <title>الملف الشخصي | HRDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #f0f4f8; min-height: 100vh; }
    .header { background: #0B6B3A; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header-btns { display: flex; gap: 8px; }
    .header button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 8px 14px; border-radius: 8px; font-family: 'Tajawal', sans-serif; cursor: pointer; font-size: 13px; white-space: nowrap; }
    .container { max-width: 700px; margin: 0 auto; padding: 20px 16px 60px; }
    .profile-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; margin-bottom: 20px; }
    .profile-header { background: linear-gradient(135deg, #0B6B3A, #1a9a5c); padding: 32px 20px; text-align: center; color: white; position: relative; }
    .avatar-wrap { position: relative; width: 100px; height: 100px; margin: 0 auto 14px; }
    .avatar-xl { width: 100px; height: 100px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; color: white; font-size: 40px; font-weight: 800; border: 4px solid rgba(255,255,255,0.4); overflow: hidden; }
    .avatar-xl img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-upload-btn { position: absolute; bottom: 2px; left: 2px; width: 30px; height: 30px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px; }
    .avatar-remove-btn { position: absolute; bottom: 2px; right: 2px; width: 30px; height: 30px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px; }
    .avatar-upload-input { display: none; }
    .uploading { font-size: 12px; color: rgba(255,255,255,0.8); margin-top: 6px; display: none; }
    .profile-header h2 { font-size: 20px; margin-bottom: 6px; }
    .role-badge { background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 13px; display: inline-block; }
    .profile-body { padding: 20px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 0; }
    .info-item { background: #f8f9fa; border-radius: 10px; padding: 14px; }
    .info-item .lbl { font-size: 11px; color: #888; margin-bottom: 3px; }
    .info-item .val { font-size: 14px; color: #333; font-weight: 600; word-break: break-word; }
    .info-item .val a { color: #0B6B3A; text-decoration: none; }
    .info-item.private { border: 1.5px dashed #ffc107; background: #fffdf0; }
    .info-item.private .lbl::after { content: ' 🔒'; }
    .edit-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 20px; }
    .edit-card h3 { font-size: 16px; color: #333; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 2px solid #e8f5ef; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { margin-bottom: 0; }
    .field.full { grid-column: 1 / -1; }
    .field label { display: block; margin-bottom: 5px; font-size: 13px; color: #444; font-weight: 600; }
    .field input, .field select { width: 100%; padding: 10px 12px; border: 1.5px solid #ddd; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 14px; }
    .field input:focus, .field select:focus { outline: none; border-color: #0B6B3A; }
    .save-btn { margin-top: 16px; padding: 11px 28px; background: #0B6B3A; color: white; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; }
    .save-btn:hover { background: #094d2a; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; font-size: 14px; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .content-card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); overflow: hidden; }
    .content-card-header { padding: 16px 20px; border-bottom: 2px solid #e8f5ef; }
    .content-card-header h3 { font-size: 16px; color: #333; }
    .content-item { padding: 14px 20px; border-bottom: 1px solid #f5f5f5; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .content-item:last-child { border-bottom: none; }
    .content-item .title { font-size: 14px; font-weight: 600; color: #333; }
    .content-item .meta { font-size: 12px; color: #888; margin-top: 2px; }
    .badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
    .badge-article { background: #e8f5ef; color: #0B6B3A; }
    .badge-video { background: #fff3cd; color: #856404; }
    .badge-images { background: #cce5ff; color: #004085; }
    .badge-default { background: #f0f0f0; color: #555; }
    .empty { text-align: center; padding: 32px; color: #aaa; font-size: 14px; }
    .admin-bar { background: #fff3cd; border: 1.5px solid #ffc107; border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
    .admin-bar-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .admin-bar span { font-size: 13px; color: #856404; font-weight: 600; }
    .admin-bar select { padding: 7px 12px; border: 1.5px solid #ffc107; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 13px; background: white; cursor: pointer; }
    .admin-bar button { padding: 7px 18px; background: #0B6B3A; color: white; border: none; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 13px; cursor: pointer; font-weight: 700; }
    .view-btn { padding: 5px 12px; background: #0B6B3A; color: white; border: none; border-radius: 6px; cursor: pointer; font-family: 'Tajawal', sans-serif; font-size: 12px; white-space: nowrap; }

    @media (max-width: 500px) {
      .info-grid { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: 1; }
      .profile-header { padding: 24px 16px; }
      .header h1 { font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="header">
  <h1>👤 الملف الشخصي</h1>
  <div class="header-btns">
    <button onclick="window.location.href='./index.html'">← الرئيسية</button>
    <button id="btn-logout">خروج</button>
  </div>
</div>

<div class="container" id="app">
  <div style="text-align:center;padding:80px 20px;color:#888;">
    <div style="font-size:44px;margin-bottom:14px;">⏳</div>
    <p>جاري التحميل...</p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fmsxnznoynnhcwvstheu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OGDFqdQK4gWgJ4EOtTna0g_24Mv7WYq';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const viewId = params.get('id');
let currentUser = null;
let currentRole = null;
let targetProfile = null;

const roleMap = { admin: '🛡️ مشرف', editor: '✏️ محرر', viewer: '👁 قارئ', pending: '⏳ في الانتظار' };
const typeMap = { 'مقال': 'badge-article', 'فيديو': 'badge-video', 'صور': 'badge-images' };
const cities = ['الرياض','جدة','مكة المكرمة','المدينة المنورة','الدمام','الخبر','الظهران','الطائف','تبوك','أبها','القصيم','حائل','جازان','نجران','الباحة','سكاكا','عرعر','أخرى'];

async function init() {
  var { data } = await sb.auth.getSession();
  if (!data.session) { window.location.href = './auth.html'; return; }
  currentUser = data.session.user;
  var { data: profile } = await sb.from('profiles').select('*').eq('id', currentUser.id).single();
  if (profile) currentRole = profile.role;
  var targetId = viewId || currentUser.id;
  var { data: target } = await sb.from('profiles').select('*').eq('id', targetId).single();
  targetProfile = target;
  if (!targetProfile) {
    document.getElementById('app').innerHTML = '<div style="text-align:center;padding:60px 20px;color:#888;"><div style="font-size:44px;">❌</div><p style="margin-top:12px;">لم يتم العثور على الملف الشخصي</p></div>';
    return;
  }
  renderProfile(targetId === currentUser.id, currentRole === 'admin');
  loadUserContent(targetId);
}

function renderProfile(isOwn, isAdmin) {
  var p = targetProfile;
  var name = p.full_name || p.email || 'مجهول';
  var avatarContent = p.avatar_url ? '<img src="' + p.avatar_url + '">' : name.charAt(0).toUpperCase();

  var adminBar = '';
  if (isAdmin && !isOwn) {
    adminBar = '<div class="admin-bar"><div class="admin-bar-top"><span>🛡️ تشاهد هذا الملف كمشرف</span><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;"><select id="role-select"><option value="pending" '+(p.role==='pending'?'selected':'')+'>pending — في الانتظار</option><option value="viewer" '+(p.role==='viewer'?'selected':'')+'>viewer — قارئ</option><option value="editor" '+(p.role==='editor'?'selected':'')+'>editor — محرر</option><option value="admin" '+(p.role==='admin'?'selected':'')+'>admin — مشرف</option></select><button onclick="changeRole()">تغيير الصلاحية</button></div></div></div>';
  }

  var editForm = '';
  if (isOwn) {
    editForm = '<div class="edit-card"><h3>✏️ تعديل معلوماتي</h3><div class="form-grid"><div class="field"><label>الاسم الكامل</label><input type="text" id="e-name" value="'+(p.full_name||'')+'"></div><div class="field"><label>جهة العمل</label><input type="text" id="e-org" value="'+(p.organization||'')+'"></div><div class="field"><label>المدينة</label><select id="e-city"><option value="">— اختر —</option>'+cities.map(function(c){ return '<option value="'+c+'" '+(p.city===c?'selected':'')+'>'+c+'</option>'; }).join('')+'</select></div><div class="field"><label>رقم الهاتف <span style="color:#aaa;font-size:11px;">(سري)</span></label><input type="tel" id="e-phone" value="'+(p.phone||'')+'"></div><div class="field full"><label>رابط LinkedIn</label><input type="url" id="e-linkedin" value="'+(p.linkedin||'')+'" placeholder="https://linkedin.com/in/..."></div></div><button class="save-btn" onclick="saveProfile()">💾 حفظ التغييرات</button><div class="msg" id="save-msg"></div></div>';
  }

  document.getElementById('app').innerHTML =
    adminBar +
    '<div class="profile-card">' +
      '<div class="profile-header">' +
        '<div class="avatar-wrap">' +
          '<div class="avatar-xl" id="avatar-display">' + avatarContent + '</div>' +
          (isOwn ? '<label class="avatar-upload-btn" for="avatar-input" title="تغيير الصورة">📷</label><input class="avatar-upload-input" type="file" id="avatar-input" accept="image/*">' + (p.avatar_url ? '<div class="avatar-remove-btn" id="remove-avatar-btn" title="إزالة">🗑️</div>' : '') : '') +
        '</div>' +
        '<div class="uploading" id="upload-hint">جاري رفع الصورة...</div>' +
        '<h2>' + name + '</h2>' +
        '<span class="role-badge">' + (roleMap[p.role] || p.role) + '</span>' +
      '</div>' +
      '<div class="profile-body">' +
        '<div class="info-grid">' +
          '<div class="info-item"><div class="lbl">📧 البريد الإلكتروني</div><div class="val">' + (p.email||'-') + '</div></div>' +
          '<div class="info-item"><div class="lbl">🏢 جهة العمل</div><div class="val">' + (p.organization||'-') + '</div></div>' +
          '<div class="info-item"><div class="lbl">📍 المدينة</div><div class="val">' + (p.city||'-') + '</div></div>' +
          '<div class="info-item"><div class="lbl">🔗 LinkedIn</div><div class="val">' + (p.linkedin ? '<a href="'+p.linkedin+'" target="_blank">عرض ↗</a>' : '-') + '</div></div>' +
          ((isOwn || isAdmin) && p.phone ? '<div class="info-item private"><div class="lbl">📞 رقم الهاتف</div><div class="val">' + p.phone + '</div></div>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +
    editForm +
    '<div class="content-card"><div class="content-card-header"><h3>📋 المحتوى المرفوع</h3></div><div id="content-list"><div class="empty">جاري التحميل...</div></div></div>';

  if (isOwn) {
    document.getElementById('avatar-input').addEventListener('change', async function() {
      var file = this.files[0];
      if (!file) return;
      if (file.size > 2*1024*1024) { alert('حجم الصورة يجب أن يكون أقل من 2MB'); return; }
      document.getElementById('upload-hint').style.display = 'block';
      var fileName = 'avatar_' + currentUser.id + '_' + Date.now() + '.' + file.name.split('.').pop();
      var { error } = await sb.storage.from('avatars').upload(fileName, file, { upsert: true });
      if (error) { alert('خطأ: ' + error.message); document.getElementById('upload-hint').style.display = 'none'; return; }
      var { data: urlData } = sb.storage.from('avatars').getPublicUrl(fileName);
      await sb.from('profiles').update({ avatar_url: urlData.publicUrl }).eq('id', currentUser.id);
      document.getElementById('avatar-display').innerHTML = '<img src="' + urlData.publicUrl + '">';
      document.getElementById('upload-hint').style.display = 'none';
      setTimeout(function(){ window.location.reload(); }, 500);
    });
    var removeBtn = document.getElementById('remove-avatar-btn');
    if (removeBtn) {
      removeBtn.addEventListener('click', async function() {
        if (!confirm('هل تريد إزالة الصورة؟')) return;
        await sb.from('profiles').update({ avatar_url: null }).eq('id', currentUser.id);
        window.location.reload();
      });
    }
  }
}

async function saveProfile() {
  var msg = document.getElementById('save-msg');
  msg.className = 'msg';
  await sb.from('profiles').update({
    full_name: document.getElementById('e-name').value,
    organization: document.getElementById('e-org').value,
    city: document.getElementById('e-city').value,
    phone: document.getElementById('e-phone').value || null,
    linkedin: document.getElementById('e-linkedin').value || null
  }).eq('id', currentUser.id);
  msg.className = 'msg ok';
  msg.textContent = '✅ تم الحفظ بنجاح!';
  setTimeout(function(){ window.location.reload(); }, 1500);
}

async function changeRole() {
  var role = document.getElementById('role-select').value;
  await sb.from('profiles').update({ role: role }).eq('id', targetProfile.id);
  alert('✅ تم تغيير الصلاحية إلى: ' + role);
  window.location.reload();
}

async function loadUserContent(userId) {
  var { data } = await sb.from('content').select('*').eq('created_by', userId).order('created_at', { ascending: false });
  if (!data || !data.length) {
    document.getElementById('content-list').innerHTML = '<div class="empty">لم يتم رفع أي محتوى بعد</div>';
    return;
  }
  var html = '';
  data.forEach(function(c) {
    var date = new Date(c.created_at).toLocaleDateString('ar-SA');
    var cls = typeMap[c.content_type] || 'badge-default';
var statusBadge = !c.is_reviewed
  ? '<span class="badge" style="background:#fff3cd;color:#856404;">⏳ قيد المراجعة</span>'
  : (c.is_hidden ? '<span class="badge" style="background:#f8d7da;color:#721c24;">🙈 مخفي</span>' : '<span class="badge" style="background:#d4edda;color:#155724;">✅ منشور</span>');
var viewUrl = './view.html?id=' + c.id;
html += '<div class="content-item"><div><div class="title">' + c.title + '</div><div class="meta">' + date + '</div></div><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;"><span class="badge ' + cls + '">' + (c.content_type||'-') + '</span>' + statusBadge + '<button class="view-btn" onclick="window.location.href=\'' + viewUrl + '\'">عرض</button></div></div>';

document.getElementById('btn-logout').addEventListener('click', async function() {
  await sb.auth.signOut();
  window.location.href = './auth.html';
});

init();
</script>
</body>
</html>
