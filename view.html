<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>عرض المحتوى | HRDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #f0f4f8; min-height: 100vh; }

    /* الهيدر */
    .header {
      background: #0B6B3A; color: white;
      padding: 14px 28px;
      display: flex; align-items: center; gap: 16px;
    }
    .header img { width: 40px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .back-btn {
      margin-right: auto;
      background: rgba(255,255,255,0.2); color: white;
      border: none; padding: 8px 16px; border-radius: 8px;
      font-family: 'Tajawal', sans-serif; cursor: pointer; font-size: 14px;
    }

    /* المحتوى */
    .container { max-width: 800px; margin: 40px auto; padding: 0 20px 60px; }

    /* بطاقة المحتوى */
    .content-card {
      background: white; border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    /* الرأس */
    .content-header {
      background: linear-gradient(135deg, #0B6B3A, #1a9a5c);
      padding: 32px 36px; color: white;
    }
    .content-meta {
      display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .badge {
      padding: 4px 14px; border-radius: 20px; font-size: 13px; font-weight: 700;
      background: rgba(255,255,255,0.2); color: white;
    }
    .content-title {
      font-size: 28px; font-weight: 800; line-height: 1.4;
    }

    /* الجسم */
    .content-body { padding: 36px; }

    /* نص المقال */
    .article-text {
      font-size: 17px; line-height: 2; color: #333;
      white-space: pre-wrap;
    }

    /* عرض الصور */
    .image-viewer img {
      width: 100%; border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    /* عرض الفيديو */
    .video-viewer video {
      width: 100%; border-radius: 12px;
      background: #000;
    }

    /* عرض الصوت */
    .audio-viewer {
      background: #f8f9fa; border-radius: 12px; padding: 32px;
      text-align: center;
    }
    .audio-viewer .audio-icon { font-size: 64px; margin-bottom: 16px; }
    .audio-viewer audio { width: 100%; margin-top: 16px; }

    /* عرض PDF */
    .pdf-viewer iframe {
      width: 100%; height: 600px; border: none; border-radius: 12px;
    }

    /* زر التحميل */
    .download-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: #0B6B3A; color: white;
      padding: 12px 24px; border-radius: 10px;
      text-decoration: none; font-size: 15px; font-weight: 700;
      margin-top: 20px; transition: background 0.2s;
    }
    .download-btn:hover { background: #094d2a; }

    /* حالة التحميل */
    .loading {
      text-align: center; padding: 80px 20px; color: #888;
    }
    .loading .spinner {
      width: 48px; height: 48px; border: 4px solid #eee;
      border-top-color: #0B6B3A; border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* خطأ */
    .error-state {
      text-align: center; padding: 80px 20px;
    }
    .error-state .icon { font-size: 64px; margin-bottom: 16px; }
    .error-state h2 { color: #333; margin-bottom: 8px; }
    .error-state p { color: #888; }
  </style>
</head>
<body>

<div class="header">
  <img src="./hrdf-logo.png" alt="HRDF">
  <h1>مبادرة الإرشاد المهني الشامل</h1>
  <button class="back-btn" onclick="window.location.href='./index.html'">← رجوع</button>
</div>

<div class="container">
  <div id="app">
    <div class="loading">
      <div class="spinner"></div>
      <p>جاري تحميل المحتوى...</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fmsxnznoynnhcwvstheu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OGDFqdQK4gWgJ4EOtTna0g_24Mv7WYq';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// احصل على ID من الرابط
const params = new URLSearchParams(window.location.search);
const contentId = params.get('id');

function getFileType(url) {
  if (!url) return null;
  const ext = url.split('?')[0].split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'image';
  if (['mp4','webm','ogg','mov'].includes(ext)) return 'video';
  if (['mp3','wav','aac','m4a'].includes(ext)) return 'audio';
  if (ext === 'pdf') return 'pdf';
  return 'file';
}

function renderContent(item) {
  const fileType = getFileType(item.file_url);
  const typeIcons = {
    'مقال': '📄', 'فيديو': '🎥', 'صور': '🖼️',
    'انفوجرافيك': '📊', 'صوت': '🎵', 'بودكاست': '🎙️', 'لقاء صحفي': '📰'
  };
  const icon = typeIcons[item.content_type] || '📄';

  // بناء محتوى العرض
  let mediaHtml = '';

  if (item.content_type === 'مقال' && item.article_text) {
    mediaHtml = `
      <div class="article-text">${item.article_text}</div>
    `;
  } else if (fileType === 'image') {
    mediaHtml = `
      <div class="image-viewer">
        <img src="${item.file_url}" alt="${item.title}">
      </div>
    `;
  } else if (fileType === 'video') {
    mediaHtml = `
      <div class="video-viewer">
        <video controls>
          <source src="${item.file_url}">
          متصفحك لا يدعم تشغيل الفيديو
        </video>
      </div>
    `;
  } else if (fileType === 'audio') {
    mediaHtml = `
      <div class="audio-viewer">
        <div class="audio-icon">${icon}</div>
        <h3>${item.title}</h3>
        <audio controls>
          <source src="${item.file_url}">
          متصفحك لا يدعم تشغيل الصوت
        </audio>
      </div>
    `;
  } else if (fileType === 'pdf') {
    mediaHtml = `
      <div class="pdf-viewer">
        <iframe src="${item.file_url}"></iframe>
      </div>
    `;
  } else if (item.file_url) {
    mediaHtml = `
      <div style="text-align:center;padding:40px;">
        <div style="font-size:64px;margin-bottom:16px;">${icon}</div>
        <p style="color:#666;margin-bottom:20px;">اضغط لتحميل أو عرض الملف</p>
        <a href="${item.file_url}" target="_blank" class="download-btn">
          ⬇️ تحميل الملف
        </a>
      </div>
    `;
  } else {
    mediaHtml = `
      <div style="text-align:center;padding:40px;color:#888;">
        <div style="font-size:64px;margin-bottom:16px;">📭</div>
        <p>لا يوجد محتوى للعرض</p>
      </div>
    `;
  }

  // زر التحميل للملفات
  const downloadBtn = item.file_url && fileType !== 'pdf' ? `
    <div style="margin-top:24px;border-top:1px solid #eee;padding-top:24px;">
      <a href="${item.file_url}" target="_blank" class="download-btn">
        ⬇️ تحميل الملف
      </a>
    </div>
  ` : '';

  document.getElementById('app').innerHTML = `
    <div class="content-card">
      <div class="content-header">
        <div class="content-meta">
          <span class="badge">${icon} ${item.content_type || 'محتوى'}</span>
          ${item.target_audience ? `<span class="badge">👥 ${item.target_audience}</span>` : ''}
        </div>
        <h1 class="content-title">${item.title}</h1>
      </div>
      <div class="content-body">
        ${mediaHtml}
        ${item.file_url && item.content_type !== 'مقال' ? downloadBtn : ''}
      </div>
    </div>
  `;

  document.title = item.title + ' | HRDF';
}

async function loadContent() {
  if (!contentId) {
    document.getElementById('app').innerHTML = `
      <div class="content-card">
        <div class="error-state">
          <div class="icon">🔍</div>
          <h2>لم يتم تحديد المحتوى</h2>
          <p>يرجى العودة للصفحة الرئيسية واختيار محتوى</p>
        </div>
      </div>
    `;
    return;
  }

  const { data, error } = await sb.from('content').select('*').eq('id', contentId).single();

  if (error || !data) {
    document.getElementById('app').innerHTML = `
      <div class="content-card">
        <div class="error-state">
          <div class="icon">❌</div>
          <h2>لم يتم العثور على المحتوى</h2>
          <p>قد يكون المحتوى محذوفاً أو غير متاح</p>
        </div>
      </div>
    `;
    return;
  }

  renderContent(data);
}

loadContent();
</script>
</body>
</html>
