<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="./irshad-logo.png">
  <link rel="apple-touch-icon" href="./irshad-logo.png">
<meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com https://www.careerguide.works;
    img-src 'self' data: blob: https:;
    connect-src 'self'
      https://fmsxnznoynnhcwvstheu.supabase.co
      wss://fmsxnznoynnhcwvstheu.supabase.co
      https://cdn.jsdelivr.net;
    form-action 'self';
    base-uri 'self';
    upgrade-insecure-requests
  ">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="X-XSS-Protection" content="1; mode=block">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta property="og:title" content="تسجيل الدخول | مبادرة الإرشاد المهني الشامل">
  <meta property="og:description" content="سجّل دخولك للوصول إلى بنك المحتوى المهني">
  <meta property="og:image" content="https://careerguide.works/irshad-logo.png">
  <meta property="og:url" content="https://careerguide.works/auth.html">
  <meta property="og:type" content="website">
  <meta name="description" content="سجّل دخولك للوصول إلى بنك المحتوى المهني - HRDF">
  <title>تسجيل الدخول | HRDF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e8f5ef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); width: 100%; max-width: 480px; }
    .logo { text-align: center; margin-bottom: 16px; }
    .logo img { width: 120px; }
    h2 { text-align: center; color: #0B6B3A; margin-bottom: 4px; font-size: 22px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 24px; }
    .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; color: #888; font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .tab.on { color: #0B6B3A; border-bottom-color: #0B6B3A; font-weight: 700; }
    .panel { display: none; }
    .panel.on { display: block; }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 5px; font-size: 14px; color: #444; font-weight: 600; }
    .field input, .field select { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 15px; transition: border 0.2s; }
    .field input:focus, .field select:focus { outline: none; border-color: #0B6B3A; }
    .field input.err-input { border-color: #dc3545; }
    .section-title { font-size: 13px; color: #0B6B3A; font-weight: 700; margin: 18px 0 12px; padding-bottom: 6px; border-bottom: 1px solid #e8f5ef; }
    .optional { color: #aaa; font-weight: 400; font-size: 12px; }
    .btn { width: 100%; padding: 13px; background: #0B6B3A; color: white; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; transition: background 0.2s; }
    .btn:hover { background: #094d2a; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo"><img src="./irshad-logo.png" alt="HRDF"></div>
  <h2>مبادرة الإرشاد المهني</h2>
  <p class="sub">منصة إدارة المحتوى</p>

  <div class="tabs">
    <div class="tab on" id="t1">تسجيل الدخول</div>
    <div class="tab" id="t2">حساب جديد</div>
  </div>

  <!-- تسجيل الدخول -->
  <div class="panel on" id="p1">
    <div class="field">
      <label>البريد الإلكتروني</label>
      <input type="email" id="l-email" placeholder="example@email.com" autocomplete="email">
    </div>
    <div class="field">
      <label>كلمة المرور</label>
      <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="btn-login">دخول</button>
    <div class="msg" id="l-msg"></div>
  </div>

  <!-- حساب جديد -->
  <div class="panel" id="p2">
    <div class="section-title">📋 المعلومات الأساسية</div>
    <div class="field"><label>الاسم الكامل *</label><input type="text" id="r-name" placeholder="الاسم الكامل" autocomplete="name"></div>
    <div class="field"><label>البريد الإلكتروني *</label><input type="email" id="r-email" placeholder="example@email.com" autocomplete="email"></div>
    <div class="field"><label>كلمة المرور *</label><input type="password" id="r-pass" placeholder="••••••••" autocomplete="new-password"></div>
    <div class="section-title">🏢 معلومات العمل</div>
    <div class="field"><label>جهة العمل *</label><input type="text" id="r-org" placeholder="اسم الجهة أو المؤسسة"></div>
    <div class="field">
      <label>المدينة *</label>
      <select id="r-city">
        <option value="">— اختر المدينة —</option>
        <option value="الرياض">الرياض</option>
        <option value="جدة">جدة</option>
        <option value="مكة المكرمة">مكة المكرمة</option>
        <option value="المدينة المنورة">المدينة المنورة</option>
        <option value="الدمام">الدمام</option>
        <option value="الخبر">الخبر</option>
        <option value="الظهران">الظهران</option>
        <option value="الطائف">الطائف</option>
        <option value="تبوك">تبوك</option>
        <option value="أبها">أبها</option>
        <option value="القصيم">القصيم</option>
        <option value="حائل">حائل</option>
        <option value="جازان">جازان</option>
        <option value="نجران">نجران</option>
        <option value="الباحة">الباحة</option>
        <option value="سكاكا">سكاكا</option>
        <option value="عرعر">عرعر</option>
        <option value="أخرى">أخرى</option>
      </select>
    </div>
    <div class="field"><label>رقم الهاتف <span class="optional">(سري — يظهر للمشرفين فقط)</span></label><input type="tel" id="r-phone" placeholder="05xxxxxxxx" autocomplete="tel"></div>
    <div class="section-title">🔗 معلومات اختيارية <span class="optional">(اختياري)</span></div>
    <div class="field"><label>رابط LinkedIn <span class="optional">(اختياري)</span></label><input type="url" id="r-linkedin" placeholder="https://linkedin.com/in/..."></div>
    <button class="btn" id="btn-register">إنشاء حساب</button>
    <div class="msg" id="r-msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://fmsxnznoynnhcwvstheu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtc3huem5veW5uaGN3dnN0aGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTY3MTQsImV4cCI6MjA5MDQzMjcxNH0.XljzZu6bjifj1D8Kp0_cM3IqW4K9YoVR-ji5gOlQjpI';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var loginAttempts = 0;
var lastAttemptTime = 0;

function checkRateLimit() {
  var now = Date.now();
  if (now - lastAttemptTime > 5 * 60 * 1000) { loginAttempts = 0; }
  if (loginAttempts >= 5) {
    var wait = Math.ceil((5 * 60 * 1000 - (now - lastAttemptTime)) / 1000 / 60);
    return 'تم تجاوز عدد المحاولات المسموح — انتظر ' + wait + ' دقيقة وحاول مجدداً';
  }
  return null;
}

function translateError(msg) {
  if (!msg) return 'حدث خطأ غير متوقع';
  var m = msg.toLowerCase();
  if (m.includes('invalid login credentials') || m.includes('invalid credentials')) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة';
  if (m.includes('email not confirmed')) return 'يرجى تأكيد بريدك الإلكتروني أولاً — تحقق من صندوق الوارد';
  if (m.includes('user already registered') || m.includes('already registered')) return 'هذا البريد الإلكتروني مسجل مسبقاً — يرجى تسجيل الدخول';
  if (m.includes('password should be at least') || m.includes('password')) return 'كلمة المرور يجب أن تكون 6 أحرف على الأقل';
  if (m.includes('unable to validate email') || m.includes('invalid email')) return 'صيغة البريد الإلكتروني غير صحيحة';
  if (m.includes('email rate limit') || m.includes('rate limit') || m.includes('too many')) return 'تم تجاوز الحد المسموح — يرجى الانتظار قليلاً والمحاولة مجدداً';
  if (m.includes('network') || m.includes('fetch')) return 'خطأ في الاتصال — تحقق من الإنترنت وحاول مجدداً';
  if (m.includes('user not found')) return 'لا يوجد حساب بهذا البريد الإلكتروني';
  if (m.includes('signup disabled') || m.includes('signups not allowed')) return 'التسجيل مغلق حالياً — يرجى التواصل مع المشرف';
  if (m.includes('weak password')) return 'كلمة المرور ضعيفة — استخدم حروفاً وأرقاماً';
  if (m.includes('email link is invalid') || m.includes('token')) return 'الرابط غير صالح أو منتهي الصلاحية';
  return 'حدث خطأ: ' + msg;
}

function redirectByRole(role, msg, btn) {
  if (role === 'super_admin' || role === 'admin') {
    window.location.href = './admin.html';
  } else if (role === 'editor' || role === 'viewer') {
    window.location.href = './index.html';
  } else {
    msg.className = 'msg err';
    msg.textContent = '⏳ حسابك في انتظار منح الصلاحية من المشرف';
    btn.textContent = 'دخول';
    btn.disabled = false;
  }
}

document.getElementById('t1').addEventListener('click', function() {
  document.getElementById('t1').className = 'tab on';
  document.getElementById('t2').className = 'tab';
  document.getElementById('p1').className = 'panel on';
  document.getElementById('p2').className = 'panel';
});
document.getElementById('t2').addEventListener('click', function() {
  document.getElementById('t2').className = 'tab on';
  document.getElementById('t1').className = 'tab';
  document.getElementById('p2').className = 'panel on';
  document.getElementById('p1').className = 'panel';
});

// ===== تسجيل الدخول =====
document.getElementById('btn-login').addEventListener('click', async function() {
  var email = document.getElementById('l-email').value.trim();
  var pass = document.getElementById('l-pass').value;
  var msg = document.getElementById('l-msg');
  var btn = document.getElementById('btn-login');
  msg.className = 'msg';

  if (!email && !pass) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور'; return; }
  if (!email) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال البريد الإلكتروني'; return; }
  if (!pass) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال كلمة المرور'; return; }
  if (!email.includes('@')) { msg.className = 'msg err'; msg.textContent = 'صيغة البريد الإلكتروني غير صحيحة'; return; }

  var rateErr = checkRateLimit();
  if (rateErr) { msg.className = 'msg err'; msg.textContent = rateErr; return; }

  btn.textContent = 'جاري الدخول...';
  btn.disabled = true;

  var res = await sb.auth.signInWithPassword({ email: email, password: pass });

  if (res.error) {
    loginAttempts++;
    lastAttemptTime = Date.now();
    msg.className = 'msg err';
    msg.textContent = translateError(res.error.message);
    btn.textContent = 'دخول';
    btn.disabled = false;
    return;
  }

  loginAttempts = 0;
  msg.className = 'msg ok';
  msg.textContent = '✅ تم تسجيل الدخول، جاري التحويل...';

  var userId = res.data.user.id;
  var profileRes = await sb.from('profiles').select('role').eq('id', userId).single();
  var role = profileRes.data ? profileRes.data.role : 'pending';

  setTimeout(function() {
    redirectByRole(role, msg, btn);
  }, 1500);
});

// ===== إنشاء حساب =====
document.getElementById('btn-register').addEventListener('click', async function() {
  var name = document.getElementById('r-name').value.trim();
  var email = document.getElementById('r-email').value.trim();
  var pass = document.getElementById('r-pass').value;
  var org = document.getElementById('r-org').value.trim();
  var city = document.getElementById('r-city').value;
  var phone = document.getElementById('r-phone').value.trim();
  var linkedin = document.getElementById('r-linkedin').value.trim();
  var msg = document.getElementById('r-msg');
  var btn = document.getElementById('btn-register');
  msg.className = 'msg';

  if (!name) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال الاسم الكامل'; document.getElementById('r-name').focus(); return; }
  if (!email) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال البريد الإلكتروني'; document.getElementById('r-email').focus(); return; }
  if (!email.includes('@') || !email.includes('.')) { msg.className = 'msg err'; msg.textContent = 'صيغة البريد الإلكتروني غير صحيحة'; document.getElementById('r-email').focus(); return; }
  if (!pass) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال كلمة المرور'; document.getElementById('r-pass').focus(); return; }
  if (pass.length < 6) { msg.className = 'msg err'; msg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; document.getElementById('r-pass').focus(); return; }
  if (!org) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال جهة العمل'; document.getElementById('r-org').focus(); return; }
  if (!city) { msg.className = 'msg err'; msg.textContent = 'يرجى اختيار المدينة'; document.getElementById('r-city').focus(); return; }
  if (phone && !/^05\d{8}$/.test(phone)) { msg.className = 'msg err'; msg.textContent = 'صيغة رقم الهاتف غير صحيحة — يجب أن يبدأ بـ 05 ويتكون من 10 أرقام'; document.getElementById('r-phone').focus(); return; }
  if (linkedin && !linkedin.startsWith('http')) { msg.className = 'msg err'; msg.textContent = 'رابط LinkedIn غير صحيح — يجب أن يبدأ بـ https://'; document.getElementById('r-linkedin').focus(); return; }

  btn.textContent = 'جاري إنشاء الحساب...';
  btn.disabled = true;

  var res = await sb.auth.signUp({ email: email, password: pass });

  if (res.error) {
    msg.className = 'msg err';
    msg.textContent = translateError(res.error.message);
    btn.textContent = 'إنشاء حساب';
    btn.disabled = false;
    return;
  }

  if (res.data && res.data.user) {
    await sb.from('profiles').update({
      full_name: name,
      organization: org,
      city: city,
      phone: phone || null,
      linkedin: linkedin || null
    }).eq('id', res.data.user.id);
  }

  msg.className = 'msg ok';
  msg.textContent = '✅ تم إنشاء الحساب بنجاح! في انتظار منح الصلاحية من المشرف، سيتم تحويلك...';
  btn.textContent = 'إنشاء حساب';
  btn.disabled = false;

  setTimeout(function() { window.location.href = './auth.html'; }, 3000);
});
</script>
</body>
</html>
