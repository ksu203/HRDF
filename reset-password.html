<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إعادة تعيين كلمة المرور | HRDF</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: linear-gradient(135deg, #f0f4f8 0%, #e8f5ef 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .container { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); width: 100%; max-width: 440px; }
    .logo { text-align: center; margin-bottom: 16px; }
    .logo img { width: 100px; }
    h2 { text-align: center; color: #0B6B3A; margin-bottom: 4px; font-size: 20px; }
    .sub { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 5px; font-size: 14px; color: #444; font-weight: 600; }
    .field input { width: 100%; padding: 11px 14px; border: 1.5px solid #ddd; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 15px; }
    .field input:focus { outline: none; border-color: #0B6B3A; }
    .btn { width: 100%; padding: 13px; background: #0B6B3A; color: white; border: none; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px; }
    .btn:hover { background: #094d2a; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-size: 14px; display: none; }
    .msg.ok { background: #d4edda; color: #155724; display: block; }
    .msg.err { background: #f8d7da; color: #721c24; display: block; }
    .strength { height: 5px; border-radius: 4px; margin-top: 6px; transition: all 0.3s; }
    .strength-text { font-size: 11px; margin-top: 3px; }
  </style>
</head>
<body>
<div class="container">
  <div class="logo"><img src="./irshad-logo.png" alt="HRDF"></div>
  <h2>إعادة تعيين كلمة المرور</h2>
  <p class="sub">أدخل كلمة المرور الجديدة</p>

  <div id="reset-form">
    <div class="field">
      <label>كلمة المرور الجديدة</label>
      <input type="password" id="new-pass" placeholder="••••••••" oninput="checkStrength(this.value)">
      <div class="strength" id="strength-bar" style="background:#eee;width:0%"></div>
      <div class="strength-text" id="strength-text"></div>
    </div>
    <div class="field">
      <label>تأكيد كلمة المرور</label>
      <input type="password" id="confirm-pass" placeholder="••••••••">
    </div>
    <button class="btn" id="btn-reset">تعيين كلمة المرور الجديدة</button>
    <div class="msg" id="reset-msg"></div>
  </div>
</div>

<script>
const sb = window.supabase.createClient(
  'https://fmsxnznoynnhcwvstheu.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZtc3huem5veW5uaGN3dnN0aGV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NTY3MTQsImV4cCI6MjA5MDQzMjcxNH0.XljzZu6bjifj1D8Kp0_cM3IqW4K9YoVR-ji5gOlQjpI'
);

function checkStrength(pass) {
  var bar = document.getElementById('strength-bar');
  var text = document.getElementById('strength-text');
  if (!pass) { bar.style.width='0%'; text.textContent=''; return; }
  var score = 0;
  if (pass.length >= 6) score++;
  if (pass.length >= 10) score++;
  if (/[A-Z]/.test(pass)) score++;
  if (/[0-9]/.test(pass)) score++;
  if (/[^A-Za-z0-9]/.test(pass)) score++;
  var levels = [
    { color: '#dc3545', width: '20%', text: 'ضعيفة جداً' },
    { color: '#fd7e14', width: '40%', text: 'ضعيفة' },
    { color: '#ffc107', width: '60%', text: 'متوسطة' },
    { color: '#0B6B3A', width: '80%', text: 'قوية' },
    { color: '#0B6B3A', width: '100%', text: 'قوية جداً ✅' }
  ];
  var level = levels[Math.min(score - 1, 4)] || levels[0];
  bar.style.background = level.color;
  bar.style.width = level.width;
  text.textContent = 'قوة كلمة المرور: ' + level.text;
  text.style.color = level.color;
}

document.getElementById('btn-reset').addEventListener('click', async function() {
  var newPass = document.getElementById('new-pass').value;
  var confirmPass = document.getElementById('confirm-pass').value;
  var msg = document.getElementById('reset-msg');
  var btn = document.getElementById('btn-reset');
  msg.className = 'msg';

  if (!newPass) { msg.className = 'msg err'; msg.textContent = 'يرجى إدخال كلمة المرور الجديدة'; return; }
  if (newPass.length < 6) { msg.className = 'msg err'; msg.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
  if (newPass !== confirmPass) { msg.className = 'msg err'; msg.textContent = 'كلمتا المرور غير متطابقتين'; return; }

  btn.textContent = 'جاري التعيين...';
  btn.disabled = true;

  var { error } = await sb.auth.updateUser({ password: newPass });

  if (error) {
    msg.className = 'msg err';
    msg.textContent = 'خطأ: ' + error.message;
    btn.textContent = 'تعيين كلمة المرور الجديدة';
    btn.disabled = false;
    return;
  }

  msg.className = 'msg ok';
  msg.textContent = '✅ تم تغيير كلمة المرور بنجاح! جاري التحويل...';
  setTimeout(function() { window.location.href = './auth.html'; }, 2000);
});
</script>
</body>
</html>
